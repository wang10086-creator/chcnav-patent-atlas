<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>人工更新草稿</title><link rel="stylesheet" href="upgrade-shell.css"><style>body{font:15px/1.7 sans-serif;margin:24px auto;padding:16px;max-width:1000px;color:#244658}input,select,textarea,button{font:inherit;padding:8px;max-width:100%;box-sizing:border-box}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}label{display:grid}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f7f9;padding:16px}button{margin:8px;cursor:pointer}.note{background:#fff5dd;padding:12px}</style><a href="index.html">返回画像</a><h1>人工更新 · 本地草稿</h1><p class="note">选择文件不会上传。确认只生成最小更新文件，不表示已提交或已发布。原 Excel、内部备注不得提交仓库。官方核验须有对应登记依据，并经 PR 审核。</p><p>流程：本地草稿 → 下载确认文件 → 本地脚本再次校验 → GitHub 草稿 PR（已提交待审核）→ 审核合并 → Pages 发布及线上回读。页面不会自动提升这些状态。</p><form id="single"></form><button id="add">添加到预览</button><hr><label>CSV／Excel／JSON 文件<input id="file" type="file" accept=".csv,.xlsx,.json"></label><label>自定义字段对应（JSON：原表头 → 模板字段，如 {"专利编号":"publicationId"}）<textarea id="mapping">{}</textarea></label><button id="template">下载中文模板</button><button id="clear">取消并清空</button><h2>预览</h2><p>新增、更新、已存在、冲突及缺失信息在此显示；下载后仍须运行权威校验。未填字段不会清空已有值。</p><pre id="preview">尚无草稿</pre><label><input type="checkbox" id="consent">已核对字段和来源，确认这些最小字段允许公开；官方登记勾选有真实依据</label><button id="export" disabled>确认并生成更新文件</button><p id="message" role="status"></p><script src="update-xlsx.js"></script><script src="manual-editor.js"></script></html>
