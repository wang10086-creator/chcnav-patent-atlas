name: Validate proposed patent updates
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: python3 verify_extract.py
      - run: python3 scripts/check_primary_coverage.py
      - run: python3 maintenance/test_updates.py
